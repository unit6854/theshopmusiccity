[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro fingerprints everything it emits into /_astro (the filename changes
# whenever the contents do), so those really are safe to pin forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image filenames are stable - the pipeline overwrites hero-bg-mobile.webp in
# place - so these were served "max-age=0, must-revalidate" to guarantee fresh
# art. That is correct but expensive: every repeat visit re-checked roughly
# thirty images and paid a round trip each to be told nothing had changed.
#
# Every image URL now carries the ?v= stamp from src/lib/asset.ts, so changed
# art arrives as a different URL and reaches even a warm cache. That makes it
# safe to let the browser hold them, and a day of freshness plus a month of
# stale-while-revalidate means a repeat visit paints from cache with no
# blocking requests while any update is picked up in the background.
#
# The one rule this creates: bump ASSET_V in src/lib/asset.ts whenever the
# artwork changes. Without a new stamp a repeat visitor can hold the old photo
# for up to a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

# Self-hosted webfonts. The contents behind a given filename never change - a
# new weight would be a new file - so these are safe to pin for a year, which
# is what keeps the font flash from ever coming back on a repeat visit.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Same reasoning: stable filenames that we overwrite in place.
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
